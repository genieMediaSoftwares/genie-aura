version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: genieaura_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: genieaura_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: genieaura_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/genieaura_db?schema=public"
      JWT_SECRET: "prod-secret-genieaura-agency-os-yendada-vizag"
      JWT_REFRESH_SECRET: "prod-refresh-secret-genieaura-agency-os"
      CORS_ORIGIN: "http://localhost:3000"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
